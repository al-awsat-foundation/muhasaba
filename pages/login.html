<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sign in — Meridian</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --ink: #0c1220;
            --ink-2: #131b30;
            --gold: #e3b968;
            --gold-soft: rgba(227, 185, 104, 0.35);
            --mist: #aab4cc;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
        }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: var(--ink);
            color: #eef1f8;
            overflow-x: hidden;
        }

        .font-display {
            font-family: 'Fraunces', serif;
        }

        /* Aurora backdrop — one slow, orchestrated drift */
        .aurora {
            position: fixed;
            inset: -20%;
            z-index: 0;
            background:
                radial-gradient(45% 35% at 20% 20%, rgba(227, 185, 104, 0.16), transparent 60%),
                radial-gradient(50% 40% at 80% 15%, rgba(90, 110, 190, 0.28), transparent 60%),
                radial-gradient(60% 50% at 50% 90%, rgba(60, 50, 110, 0.35), transparent 60%);
            filter: blur(40px);
            animation: drift 26s ease-in-out infinite alternate;
        }

        @keyframes drift {
            0% {
                transform: translate3d(0, 0, 0) scale(1);
            }

            100% {
                transform: translate3d(2%, -3%, 0) scale(1.08);
            }
        }

        /* Starfield */
        .stars {
            position: fixed;
            inset: 0;
            z-index: 0;
            background-image:
                radial-gradient(1px 1px at 10% 20%, #fff, transparent),
                radial-gradient(1px 1px at 80% 10%, #fff, transparent),
                radial-gradient(1.5px 1.5px at 60% 70%, #fff, transparent),
                radial-gradient(1px 1px at 30% 80%, #fff, transparent),
                radial-gradient(1px 1px at 90% 60%, #fff, transparent),
                radial-gradient(1.5px 1.5px at 45% 35%, #fff, transparent),
                radial-gradient(1px 1px at 15% 55%, #fff, transparent),
                radial-gradient(1px 1px at 70% 90%, #fff, transparent);
            background-repeat: no-repeat;
            opacity: 0.5;
            animation: twinkle 5s ease-in-out infinite;
        }

        @keyframes twinkle {

            0%,
            100% {
                opacity: 0.35;
            }

            50% {
                opacity: 0.65;
            }
        }

        .card {
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.06), rgba(255, 255, 255, 0.02));
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(18px);
            box-shadow: 0 30px 80px -20px rgba(0, 0, 0, 0.6);
        }

        .field {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: border-color .2s ease, background .2s ease;
        }

        .field:focus-within {
            border-color: var(--gold-soft);
            background: rgba(255, 255, 255, 0.06);
        }

        .field input {
            background: transparent;
            outline: none;
            color: #f3f5fa;
            width: 100%;
        }

        .field input::placeholder {
            color: #6c7793;
        }

        .btn-gold {
            background: linear-gradient(180deg, #ecc784, var(--gold));
            color: #1a1406;
            transition: transform .15s ease, box-shadow .15s ease;
        }

        .btn-gold:hover {
            transform: translateY(-1px);
            box-shadow: 0 10px 30px -8px var(--gold-soft);
        }

        .btn-gold:active {
            transform: translateY(0);
        }

        /* One orchestrated entrance — staggered, not per-hover */
        .enter {
            opacity: 0;
            transform: translateY(14px);
            animation: rise .7s cubic-bezier(.2, .7, .2, 1) forwards;
        }

        .enter-1 {
            animation-delay: .05s;
        }

        .enter-2 {
            animation-delay: .15s;
        }

        .enter-3 {
            animation-delay: .25s;
        }

        .enter-4 {
            animation-delay: .35s;
        }

        .enter-5 {
            animation-delay: .45s;
        }

        @keyframes rise {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        a.link {
            color: var(--gold);
            text-decoration: none;
            border-bottom: 1px solid transparent;
        }

        a.link:hover {
            border-bottom-color: var(--gold-soft);
        }

        @media (prefers-reduced-motion: reduce) {

            .aurora,
            .stars,
            .enter {
                animation: none !important;
            }

            .enter {
                opacity: 1;
                transform: none;
            }
        }
    </style>
</head>

<body class="min-h-screen flex items-center justify-center px-5 py-10">

    <div class="stars" aria-hidden="true"></div>
    <div class="aurora" aria-hidden="true"></div>

    <main class="relative z-10 w-full max-w-sm">

        <div class="enter enter-1 text-center mb-8">

            <a href="../index.html">
                <h1 class="font-display text-3xl font-medium tracking-tight text-white">Muhasaba</h1>
            </a>
            <p class="text-sm text-[var(--mist)] mt-1">Login to continue.</p>
        </div>

        <form class="card enter enter-2 rounded-2xl p-7 space-y-5" onsubmit="return false;">

            <div>
                <label for="email" class="block text-xs text-[var(--mist)] mb-1.5">Email</label>
                <div class="field rounded-lg px-3.5 py-2.5">
                    <input id="email" type="email" placeholder="you@example.com" required />
                </div>
            </div>

            <div>
                <div class="field rounded-lg px-3.5 py-2.5 flex items-center gap-2">
                    <input id="password" type="password" placeholder="••••••••" required class="flex-1" />
                    <button type="button" id="toggle-password" aria-label="Show password"
                        class="text-[var(--mist)] hover:text-white transition-colors shrink-0">
                        <svg id="eye-open" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z" />
                            <circle cx="12" cy="12" r="3" />
                        </svg>
                        <svg id="eye-closed" width="18" height="18" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
                            class="hidden">
                            <path
                                d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a20.3 20.3 0 0 1 4.22-5.12M9.9 4.24A10.4 10.4 0 0 1 12 4c7 0 11 7 11 7a20.4 20.4 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24" />
                            <line x1="1" y1="1" x2="23" y2="23" />
                        </svg>
                    </button>
                </div>

            </div>

            <label class="flex items-center gap-2 text-xs text-[var(--mist)] select-none">
                <input type="checkbox" class="accent-[var(--gold)] w-3.5 h-3.5" />
                Keep me signed in
            </label>

            <button id="login-btn" type="submit" class="btn-gold w-full rounded-lg py-2.5 font-medium text-sm">
                Log in
            </button>

            <div class="flex items-center gap-3 py-1">
                <div class="h-px flex-1 bg-white/10"></div>
                <span class="text-[11px] text-[var(--mist)]">or</span>
                <div class="h-px flex-1 bg-white/10"></div>
            </div>
            <p class="enter enter-5 text-center text-sm text-[var(--mist)] mt-6">
                Don't have account? <a href="./register.html" class="link">Register</a>
            </p>

        </form>



    </main>


    <script src="../js/config.js">   </script>
    <script src="../js/login.js">   </script>

</body>

</html>
